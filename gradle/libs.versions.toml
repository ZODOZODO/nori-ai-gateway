[versions]
jsonCanonicalization = "1.1"
springBoot = "4.0.7"
springAi = "2.0.2"
testcontainers = "2.0.3"
djlTokenizers = "0.40.0"
archunit = "1.5.1"
jsonSchemaValidator = "3.0.9"
protobuf = "4.33.2"
protobufPlugin = "0.10.0"
nimbusJoseJwt = "10.5"
awsSdk = "2.46.17"
otelLogback = "2.33.1-alpha"
openaiJava = "4.80.0"
# java-module-conventions 가 compileOnly 로 붙이는 slf4j-api 는 BOM 밖에서 버전이 필요하다. Spring Boot 4.0.7 BOM 의 slf4j.version 과 같다.
slf4j = "2.0.18"
# 루트 외부 Flyway 도구(U5)용. Spring Boot 4.0.7 BOM 의 flyway.version 과 같다.
flyway = "11.14.1"
# 루트 Flyway buildscript classpath 의 JDBC 드라이버. Spring Boot 4.0.7 BOM 의 postgresql.version 과 같다.
postgresql = "42.7.11"
# noricloud GitLab Package Registry project 33 의 고정 release.
noriObjectStorage = "0.0.1"

[libraries]
json-canonicalization = { module = "io.github.erdtman:java-json-canonicalization", version.ref = "jsonCanonicalization" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
spring-ai-openai = { module = "org.springframework.ai:spring-ai-openai" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djlTokenizers" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
protobuf = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
nori-storage-starter = { module = "com.nori:nori-object-storage-s3-starter", version.ref = "noriObjectStorage" }
otel-logback = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "otelLogback" }
otel-instrumentation-bom-alpha = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha", version.ref = "otelLogback" }
openai-java-okhttp = { module = "com.openai:openai-java-client-okhttp", version.ref = "openaiJava" }
junit-bom = { module = "org.junit:junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj = { module = "org.assertj:assertj-core" }
jackson = { module = "com.fasterxml.jackson.core:jackson-databind" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
flyway-gradle-plugin = { module = "org.flywaydb:flyway-gradle-plugin", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }

workflow:
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.noricloud.org"'
    - when: never

stages: [check, package, verify, build, scan, migrate, deploy]
variables:
  # settings-conventions(nori-common/build-logic)는 GitLab Package Registry 를 gitlabBaseUrl|GITLAB_BASE_URL 이 있을 때만
  # 등록한다(nori-wm-ui-backend 와 같은 CI 입력). project id 는 gradle.properties 의 gitlabPackageProjectIds, 인증은 CI_JOB_TOKEN 이다.
  GITLAB_BASE_URL: "https://gitlab.noricloud.org"
default:
  tags: [nori-msa]

# P15final 생산자(task·스크립트·검사 main)와 운영 gate가 없으면 해당 job은 실패합니다.
# gradlew 는 레포에 실행 권한 없이(100644) 저장되어 있으므로 bash 로 실행한다(작업 트리 chmod 0 — package 의 dirty 검사 유지).
.aigw-spec-input:
  before_script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.noricloud.org/norisystem/nori-tc/nori-common.git ../nori-common
    - 'test -n "$AIGW_APPROVED_SPEC_SHA"'
    - 'bash ./gradlew :gateway-eval:run --args="spec-input fetch --api-url $CI_API_V4_URL --project-id $CI_PROJECT_ID --sha $AIGW_APPROVED_SPEC_SHA --baseline docs/gates/spec-baseline.md --out-dir build/spec-input --auth-header JOB-TOKEN --token-env CI_JOB_TOKEN" --no-daemon'
    - 'export AIGW_SPEC_FILE="$CI_PROJECT_DIR/build/spec-input/$AIGW_APPROVED_SPEC_SHA/spec.md"'
    - 'bash ./gradlew :gateway-eval:run --args="spec-guard --spec $AIGW_SPEC_FILE --baseline docs/gates/spec-baseline.md" --no-daemon'

test:
  extends: .aigw-spec-input
  stage: check
  dependencies: []
  script:
    - bash ./gradlew build --no-daemon

helm-validate:
  stage: check
  dependencies: []
  script:
    - test -f operations/deploy/aigw-helm.sh
    - |
      for release in ai-gateway ai-gateway-restore ai-gateway-db-restore; do
        bash operations/deploy/aigw-helm.sh --release "$release" --mode lint --runconfig operations/runconfig/fixtures/lint-verify.json --image-digests operations/runconfig/fixtures/lint-image-digests.json --suite none || exit "$?"
      done
  artifacts:
    paths: [build/helm-validation/]

package:
  stage: package
  dependencies: []
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.noricloud.org/norisystem/nori-tc/nori-common.git ../nori-common
    - bash ./gradlew aigwPackage -Paigw.gitSha=$CI_COMMIT_SHA --no-daemon
    - test -s build/package/build-identity.json
  artifacts:
    paths:
      - build/package/app.jar
      - build/package/acceptance/
      - build/package/runtime-classpath.txt
      - build/package/build-identity.json

integration-test:
  extends: .aigw-spec-input
  stage: verify
  rules:
    - if: '$AIGW_CI_IT_MODE == "runner"'
  tags: ['$AIGW_IT_RUNNER_TAG']
  dependencies: [package]
  script:
    - test -n "$AIGW_IT_RUNNER_TAG"
    - bash ./gradlew integrationTest -Paigw.requireDocker=true --no-daemon
    - 'bash ./gradlew :gateway-eval:run --args="test-evidence verify --selector integrationTest --required ci/integration-required.txt --require-docker --expect-build-identity build/package/build-identity.json" --no-daemon'
  artifacts:
    when: always
    paths: ['**/build/aigw-evidence/**']

integration-evidence:
  extends: .aigw-spec-input
  stage: verify
  rules:
    - if: '$AIGW_CI_IT_MODE == "evidence"'
  dependencies: [package]
  script:
    - 'test "$CI_API_V4_URL" = "https://gitlab.noricloud.org/api/v4"'
    - 'printf ''header = "JOB-TOKEN: %s"\n'' "$CI_JOB_TOKEN" | curl --config - --fail --silent --show-error --proto "=https" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aigw-it-evidence/$CI_COMMIT_SHA/it-evidence.tgz" --output it-evidence.tgz'
    - 'bash ./gradlew :gateway-eval:run --args="ci-evidence verify --sha $CI_COMMIT_SHA --bundle it-evidence.tgz --required ci/integration-required.txt --spec $AIGW_SPEC_FILE --baseline docs/gates/spec-baseline.md --expect-build-identity build/package/build-identity.json" --no-daemon'

integration-mode-guard:
  stage: verify
  dependencies: []
  rules:
    - if: '$AIGW_CI_IT_MODE != "runner" && $AIGW_CI_IT_MODE != "evidence"'
  script:
    - echo CI_IT_MODE_UNSET >&2
    - exit 1

build-image:
  stage: build
  image:
    name: '$AIGW_CI_KANIKO_IMAGE'
    entrypoint: ['']
  dependencies: [package]
  script:
    - |
      set -eu
      command -v jq >/dev/null
      git_sha=$(jq -er '.gitSha | select(test("^[0-9a-f]{40}$"))' build/package/build-identity.json)
      app_sha=$(jq -er '.appJarSha256 | select(test("^[0-9a-f]{64}$"))' build/package/build-identity.json)
      runtime_sha=$(jq -er '.runtimeClasspathSha256 | select(test("^[0-9a-f]{64}$"))' build/package/build-identity.json)
      test "$git_sha" = "$CI_COMMIT_SHA"
      printf '%s  build/package/app.jar\n' "$app_sha" | sha256sum --check --status
      printf '%s  build/package/runtime-classpath.txt\n' "$runtime_sha" | sha256sum --check --status
      migrations_sha=$(find flyway/sql -type f -print | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d ' ' -f 1)
      mkdir -p build/image-digest
      /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile operations/deploy/docker/Dockerfile --destination "harbor.nori.local/nori-tc/ai-gateway:$CI_PIPELINE_ID" --build-arg "GIT_SHA=$git_sha" --build-arg "APP_JAR_SHA256=$app_sha" --build-arg "RUNTIME_CLASSPATH_SHA256=$runtime_sha" --build-arg "MIGRATIONS_SHA256=$migrations_sha" --digest-file build/image-digest/app.digest
  artifacts:
    paths: [build/image-digest/app.digest]

build-backup-image:
  stage: build
  image:
    name: '$AIGW_CI_KANIKO_IMAGE'
    entrypoint: ['']
  dependencies: []
  script:
    - |
      set -eu
      : "${AIGW_PG_IMAGE_DIGEST:?}" "${AIGW_AGE_VERSION:?}" "${AIGW_AGE_SHA256:?}" "${AIGW_BACKUP_DEST_TYPE:?}"
      case "$AIGW_BACKUP_DEST_TYPE" in
        s3) : "${AIGW_RCLONE_VERSION:?}" "${AIGW_RCLONE_SHA256:?}" ;;
        sftp) : "${AIGW_OPENSSH_CLIENT_VERSION:?}" ;;
        *) echo BACKUP_DEST_TYPE_UNSUPPORTED >&2; exit 2 ;;
      esac
      mkdir -p build/image-digest
      /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile operations/deploy/docker/Dockerfile-backup --destination "harbor.nori.local/nori-tc/ai-gateway-backup:$CI_PIPELINE_ID" --build-arg "PG_IMAGE_REPOSITORY=harbor.nori.local/library/pgvector" --build-arg "PG_IMAGE_DIGEST=$AIGW_PG_IMAGE_DIGEST" --build-arg "AGE_VERSION=$AIGW_AGE_VERSION" --build-arg "AGE_SHA256=$AIGW_AGE_SHA256" --build-arg "BACKUP_DEST_TYPE=$AIGW_BACKUP_DEST_TYPE" --build-arg "RCLONE_VERSION=${AIGW_RCLONE_VERSION:-}" --build-arg "RCLONE_SHA256=${AIGW_RCLONE_SHA256:-}" --build-arg "OPENSSH_CLIENT_VERSION=${AIGW_OPENSSH_CLIENT_VERSION:-}" --digest-file build/image-digest/backup.digest
  artifacts:
    paths: [build/image-digest/backup.digest]

build-acceptance-image:
  stage: build
  image:
    name: '$AIGW_CI_KANIKO_IMAGE'
    entrypoint: ['']
  dependencies: [package]
  script:
    - test -x build/package/acceptance/bin/ai-gateway-acceptance-app
    - mkdir -p build/image-digest
    - '/kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile operations/deploy/docker/Dockerfile-acceptance --destination "harbor.nori.local/nori-tc/ai-gateway-acceptance:$CI_PIPELINE_ID" --digest-file build/image-digest/acceptance.digest'
  artifacts:
    paths: [build/image-digest/acceptance.digest]

scan-image:
  stage: scan
  image:
    name: '$AIGW_CI_SCAN_IMAGE'
    entrypoint: ['']
  dependencies: [package, build-image, build-backup-image, build-acceptance-image]
  script:
    - |
      set -eu
      for item in app backup acceptance; do
        digest=$(cat "build/image-digest/$item.digest")
        printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
        case "$item" in app) repository=ai-gateway ;; backup) repository=ai-gateway-backup ;; acceptance) repository=ai-gateway-acceptance ;; esac
        trivy image --severity HIGH,CRITICAL --exit-code 1 "harbor.nori.local/nori-tc/$repository@$digest"
      done
      jq -n --arg app "$(cat build/image-digest/app.digest)" --arg backup "$(cat build/image-digest/backup.digest)" --arg acceptance "$(cat build/image-digest/acceptance.digest)" --slurpfile identity build/package/build-identity.json '{app:$app,backup:$backup,acceptance:$acceptance,buildIdentity:$identity[0]}' > image-digests.json
  artifacts:
    paths: [image-digests.json]

# 공유 서버 DB nori_ai_gateway 에 루트 Gradle Flyway(flyway/sql, 이력 schema gw_flyway)를 적용한다(nori-wm-ui-backend migrate job 형태).
# 순서는 needs 없이 stage 로만 강제한다 — 이 job 이 실패하면 뒤 stage 의 deploy-verify 는 시작되지 않는다.
# 계정 이름·비밀번호는 CI 변수 AI_GATEWAY_DB_USER(masked)·AI_GATEWAY_DB_PASSWORD(protected·masked)로만 받는다.
# -Pflyway.* 를 쓰지 않는 이유: CI trace 에 명령줄이 찍힌다. build.gradle.kts 가 env AI_GATEWAY_DB_URL/USER/PASSWORD 를 읽는다.
# 둘 중 하나라도 비면 Gradle 호출 전에 실패한다(protected 변수는 protected 가 아닌 ref 에서 비어 있다).
# migrate 의 종료 코드만 믿지 않고 적용 뒤 flywayInfo 로 Pending 잔존을 다시 본다.
# flywayInfo -q 의 stdout 은 "Schema version" 줄과 Category/Version/Description/Type/Installed On/State/Undoable 표뿐이라
# (Flyway 11.14.1 FlywayInfoTask·MigrationInfoDumper) 계정 이름·URL 이 artifact 에 들어가지 않는다.
migrate:
  stage: migrate
  tags: [nori-msa]
  dependencies: []
  allow_failure: false
  variables:
    AI_GATEWAY_DB_URL: "jdbc:postgresql://192.168.0.150:15432/nori_ai_gateway"
  script:
    - 'if [ -z "$AI_GATEWAY_DB_USER" ] || [ -z "$AI_GATEWAY_DB_PASSWORD" ]; then echo "AI_GATEWAY_DB_USER or AI_GATEWAY_DB_PASSWORD is empty - register both as CI variables (protected ref required)" >&2; exit 1; fi'
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.noricloud.org/norisystem/nori-tc/nori-common.git ../nori-common
    - bash ./gradlew flywayInfo -q --no-daemon
    - bash ./gradlew flywayMigrate --no-daemon
    - bash ./gradlew flywayInfo -q --no-daemon > flyway-info-after.txt
    - 'if grep -q "Pending" flyway-info-after.txt; then echo "Pending migrations remain after flywayMigrate" >&2; exit 1; fi'
  artifacts:
    when: always
    paths: [flyway-info-after.txt]
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

deploy-verify:
  stage: deploy
  dependencies: [scan-image]
  when: manual
  allow_failure: false
  script:
    - test -f operations/deploy/aigw-helm.sh
    - 'bash operations/deploy/aigw-helm.sh --release ai-gateway --mode deploy --runconfig "$AIGW_RUNCONFIG" --image-digests image-digests.json --suite none'

{{- include "db.guard" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicas }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "db.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "db.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ include "db.image" . | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: nori_ai_gateway
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
            # 리허설 동안만 쓰는 임시 인스턴스의 superuser 비밀번호(ingress 는 NetworkPolicy 의 db-target 라벨 Pod 만).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-config
                  key: AI_GATEWAY_DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, nori_ai_gateway]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "db.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: {{ required "RENDER_REQUIRED_persistence.size" .Values.persistence.size | quote }}

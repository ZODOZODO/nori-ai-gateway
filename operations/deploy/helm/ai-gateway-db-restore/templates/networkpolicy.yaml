apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "db.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              aigw.nori/db-target: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432

{{- include "db.guard" . }}
{{- if and .Values.backup.enabled (ne .Release.Name "ai-gateway-db-restore") }}
{{- $type := required "RENDER_REQUIRED_backup.type" .Values.backup.type }}
{{- if not (has $type (list "s3" "sftp")) }}{{ fail "RENDER_INVALID_backup.type" }}{{ end }}
{{- $digest := required "RENDER_REQUIRED_backup.image.digest" .Values.backup.image.digest }}
{{- if not (regexMatch "^[a-f0-9]{64}$" $digest) }}{{ fail "RENDER_INVALID_backup.image.digest" }}{{ end }}
{{- $days := required "RENDER_REQUIRED_backup.retentionDays" .Values.backup.retentionDays }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  schedule: {{ required "RENDER_REQUIRED_backup.schedule" .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: ai-gateway-backup
            aigw.nori/db-target: {{ .Release.Name }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: {{ printf "harbor.nori.local/nori-tc/ai-gateway-backup@sha256:%s" $digest | quote }}
              command: [/opt/aigw/aigw-backup.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: HOME, value: /tmp}
                - {name: PGHOST, value: {{ .Release.Name | quote }}}
                - {name: PGPORT, value: "5432"}
                - {name: PGDATABASE, value: ai_gateway}
                - {name: PGUSER, value: aigw_backup}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ai-gateway-db-backup
                      key: password
                - {name: AIGW_BACKUP_DESTINATION, value: {{ required "RENDER_REQUIRED_backup.destination" .Values.backup.destination | quote }}}
                - {name: AIGW_BACKUP_AGE_RECIPIENT, value: {{ required "RENDER_REQUIRED_backup.ageRecipient" .Values.backup.ageRecipient | quote }}}
                - {name: AIGW_BACKUP_RETENTION_DAYS, value: {{ $days | toString | quote }}}
                - {name: AIGW_BACKUP_CREDENTIALS_DIR, value: /run/aigw/backup-destination}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: plain, mountPath: /work/plain}
                - {name: enc, mountPath: /work/enc}
                - {name: destination, mountPath: /run/aigw/backup-destination, readOnly: true}
          volumes:
            - name: tmp
              emptyDir: {medium: Memory, sizeLimit: 16Mi}
            # 평문 제어 파일만 두는 메모리 작업 공간. 덤프 평문은 파일로 쓰지 않는다.
            - name: plain
              emptyDir: {medium: Memory, sizeLimit: 64Mi}
            - name: enc
              emptyDir: {}
            - name: destination
              secret:
                secretName: ai-gateway-backup-destination
                defaultMode: 0440
                items:
                  {{- range (ternary (list "access-key" "secret-key") (list "ssh-private-key" "known-hosts") (eq $type "s3")) }}
                  - {key: {{ . }}, path: {{ . }}}
                  {{- end }}
{{- end }}

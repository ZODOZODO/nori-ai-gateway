{{- include "db.guard" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels:
    {{- include "db.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: ai-gateway-db-bootstrap
        aigw.nori/db-instance: {{ .Release.Name }}
        aigw.nori/db-target: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: {{ include "db.image" . | quote }}
          command: [psql]
          args: ["-X", "-w", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap/bootstrap.sql"]
          env:
            - name: PGHOST
              value: {{ .Release.Name }}
            - name: PGPORT
              value: "15432"
            - name: PGDATABASE
              value: nori_ai_gateway
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-config
                  key: AI_GATEWAY_DB_PASSWORD
            {{- include "db.accountEnv" . | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: {{ .Release.Name }}-bootstrap

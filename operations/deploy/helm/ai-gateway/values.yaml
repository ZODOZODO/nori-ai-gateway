# 확인하지 않은 주소·digest·자격 참조는 배포 기본값으로 허용하지 않습니다.
profile: verify
replicaCount: 1
image:
  repository: harbor.nori.local/nori-tc/ai-gateway
  digest: ""
capacity:
  maxRunningJobs: 1
  generationConcurrency: 1
  queuedDepth: 4
  queueWaitLimit: 60s
  jobLifetimeLimit: 180s
inference:
  enabled: false
  baseUrl: ""
  port: 0
knowledgeSource:
  read:
    enabled: false
ingest:
  enabled: false
  fixtureCatalog:
    enabled: false
fixtureCatalog:
  content: ""
  prefix: ""
seaweed:
  s3Endpoint: ""
kafka:
  bootstrapServers: ""
  topic: ""
  groupId: ""
# 검증 전용 sanitize 규칙 버전 표지(F3-RULEVER 만 mask-v1r, --set-extra 로만). 소비는 P24.
sanitize:
  verifyRuleSet: mask-v1
testHooks:
  enabled: false
  clock:
    mode: ""
    initial: ""
credentialsRef:
  acceptanceSigner: ""
  acceptanceClient: ""
  acceptanceFixtureWriter: ""
# 앱 자격·DB 설정 파일 Secret. 운영자가 만들고 차트는 참조만 한다(Plan U6 ①).
configSecret:
  create: false
  name: ai-gateway-config
netpol:
  targets: {}
egressProbe:
  targets: []
specVerify:
  version: v1
  gzipBase64: ""
  sha256: ""
  expectedSha256: ""
acceptance:
  enabled: false
  suite: none
  parentRunId: ""
  outagePhase: ""
  rubricTargets: ""
  buildIdentityJson: ""
  image:
    repository: harbor.nori.local/nori-tc/ai-gateway-acceptance
    digest: ""
  readback:
    loki: ""
    tempo: ""
    metrics: ""
    approvalRef: ""

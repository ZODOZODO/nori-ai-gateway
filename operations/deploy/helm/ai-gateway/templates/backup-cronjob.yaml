{{- include "aigw.guard" . }}
{{- if .Values.backup.enabled }}
{{- /* 백업 대상 = 공유 서버의 nori_ai_gateway, 접속 = 앱과 같은 단일 계정(Plan P15 2026-11-10). 이름은 기존 명령·runbook 그대로 ai-gateway-db-backup. */ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-gateway-db-backup
  labels:
    {{- include "aigw.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: ai-gateway-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: {{ printf "harbor.nori.local/nori-tc/ai-gateway-backup@sha256:%s" .Values.backup.image.digest | quote }}
              command: [/opt/aigw/aigw-backup.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: HOME, value: /tmp}
                - {name: PGHOST, value: "192.168.0.150"}
                - {name: PGPORT, value: "15432"}
                - {name: PGDATABASE, value: nori_ai_gateway}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.configSecret.name }}
                      key: AI_GATEWAY_DB_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.configSecret.name }}
                      key: AI_GATEWAY_DB_PASSWORD
                - {name: AIGW_BACKUP_DESTINATION, value: {{ .Values.backup.destination | quote }}}
                - {name: AIGW_BACKUP_AGE_RECIPIENT, value: {{ .Values.backup.ageRecipient | quote }}}
                - {name: AIGW_BACKUP_RETENTION_DAYS, value: {{ .Values.backup.retentionDays | toString | quote }}}
                - {name: AIGW_BACKUP_CREDENTIALS_DIR, value: /run/aigw/backup-destination}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: plain, mountPath: /work/plain}
                - {name: enc, mountPath: /work/enc}
                - {name: destination, mountPath: /run/aigw/backup-destination, readOnly: true}
          volumes:
            - name: tmp
              emptyDir: {medium: Memory, sizeLimit: 16Mi}
            # 평문 제어 파일만 두는 메모리 작업 공간. 덤프 평문은 파일로 쓰지 않는다.
            - name: plain
              emptyDir: {medium: Memory, sizeLimit: 64Mi}
            - name: enc
              emptyDir: {}
            - name: destination
              secret:
                secretName: ai-gateway-backup-destination
                defaultMode: 0440
                items:
                  {{- range (ternary (list "access-key" "secret-key") (list "ssh-private-key" "known-hosts") (eq .Values.backup.type "s3")) }}
                  - {key: {{ . }}, path: {{ . }}}
                  {{- end }}
{{- end }}

{{- include "aigw.guard" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "aigw.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "aigw.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ include "aigw.image" . | quote }}
          command: [java, -Dloader.main=com.nori.ai.gateway.app.config.MigrateApplication, -cp, /app/app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: migrate}
            - {name: SPRING_DATASOURCE_URL, value: {{ printf "jdbc:postgresql://%s:5432/ai_gateway" .Values.db.release | quote }}}
            - {name: SPRING_DATASOURCE_USERNAME, value: aigw_migrator}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsRef.dbMigrator }}
                  key: password
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}

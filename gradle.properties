# Gradle JVM 기본 인코딩을 UTF-8 로 고정한다. 한글 주석/문자열 컴파일·로그 인코딩 불일치 방지.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8

# 교차 레포 Maven Package Registry project ID(settings-conventions 가 gitlabBaseUrl|GITLAB_BASE_URL 과 credential 이 있을 때만 등록).
# nori-object-storage(33, com.nori:nori-object-storage-*:0.0.1) 하나만 소비한다. com.nori.common·com.nori.tc·com.nori.wm 좌표는 소비하지 않는다.
gitlabPackageProjectIds=33

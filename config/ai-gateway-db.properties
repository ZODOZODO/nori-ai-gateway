# AI Gateway DB 접속(nori-wm config/wm-db.properties 와 같은 자리).
# 운영 DB = 공유 서버 192.168.0.150:15432 의 nori_ai_gateway, 단일 계정.
# 계정 이름·비밀번호는 환경변수 AI_GATEWAY_DB_USER·AI_GATEWAY_DB_PASSWORD 로만 주입하며 기본값을 두지 않는다
# (k8s 는 Secret ai-gateway-config 의 같은 이름 키, CI 는 CI 변수). 이 파일에 값을 쓰지 않는다.
spring.datasource.url=jdbc:postgresql://${AI_GATEWAY_DB_HOST:192.168.0.150}:${AI_GATEWAY_DB_PORT:15432}/${AI_GATEWAY_DB_NAME:nori_ai_gateway}
spring.datasource.username=${AI_GATEWAY_DB_USER}
spring.datasource.password=${AI_GATEWAY_DB_PASSWORD}

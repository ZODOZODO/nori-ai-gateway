# P15 백업 경보(Plan §11.6 AIGW-BACKUP-*). 클러스터 Prometheus Operator 의 rule selector 는 label release=monitoring 이다(root 읽기 전용 확인).
# 배포는 G-ALERT 승인 뒤에만 한다. Alertmanager 수신처가 비어 있으면(null receiver) 경보 발생은 실제 전달 PASS 가 아니다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aigw-backup
  namespace: tc
  labels:
    release: monitoring
    app.kubernetes.io/part-of: ai-gateway
spec:
  groups:
    - name: aigw-backup
      rules:
        - alert: AIGW-BACKUP-FAILED
          # BackupStatusMetrics: gw.backup_run 최신 행이 FAILED 이면 1(백업 스크립트의 실패 기록 직후).
          expr: aigw_backup_last_run_failed == 1
          labels:
            severity: critical
          annotations:
            summary: "AI Gateway 검증 환경 백업 실패"
        - alert: AIGW-BACKUP-STALE
          # 마지막 성공이 24h 를 넘거나 성공 이력이 없으면(지표 부재·NaN) RPO 목표 미충족이다.
          expr: (time() - aigw_backup_last_success_timestamp_seconds) > 86400 or absent(aigw_backup_last_success_timestamp_seconds) or aigw_backup_last_success_timestamp_seconds != aigw_backup_last_success_timestamp_seconds
          labels:
            severity: warning
          annotations:
            summary: "AI Gateway 백업 RPO 목표 미충족(마지막 성공 24h 초과)"
